services:
  api:
    build:
      context: ..
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ../.env
    volumes:
      - /var/talus/data:/app/data

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TALUS_HOST: ${TALUS_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
