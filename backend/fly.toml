app = "talus-hiking"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "talus_data"
  destination = "/app/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
